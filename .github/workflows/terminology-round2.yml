name: Second-pass legal terminology audit
on:
  push:
    branches: [cms-deneme]
    paths: ['.github/workflows/terminology-round2.yml']
permissions:
  contents: write
jobs:
  audit-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v5
        with: {node-version: 24}
      - name: Apply changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re,html
          R=Path('.')
          def fm(t,k):
              m=re.search(rf'(?m)^{re.escape(k)}:\s*["\']?(.+?)["\']?\s*$',t)
              return m.group(1).strip().strip('"\'') if m else ''
          def clean(v): return re.sub(r'\s+',' ',html.unescape(re.sub(r'<[^>]+>',' ',v or ''))).strip()
          def fld(t,k):
              m=re.search(rf'<strong>{re.escape(k)}:</strong>\s*([^<]+)',t)
              return clean(m.group(1)) if m else ''
          def tags(title,summary):
              s=(title+' '+summary).lower(); out=[]
              pairs=[('Arsa payı',['arsa payı']),('Yüklenici',['yüklenici']),('Fesih',['fesih']),('Tapu iptali ve tescil',['tapu iptali','tescil']),('İyiniyet',['iyiniyet']),('Hile',['hile']),('Şekil şartı',['şekil şart','resmî biçim']),('Takas ve mahsup',['takas','mahsup']),('Ayıplı ifa',['ayıplı','ayıp']),('Kira kaybı',['kira kaybı']),('Nama ifa',['nama ifa']),('Alt yüklenici',['alt yüklenici']),('İtirazın kaldırılması',['itirazın kaldırılması']),('Yapı Kayıt Belgesi',['yapı kayıt belgesi']),('Miras ortaklığı',['miras ortaklığı','elbirliği']),('Tasarrufun iptali',['tasarrufun iptali']),('Aciz hâli',['aciz hâli','aciz hali']),('Bekletici mesele',['bekletici mesele']),('Paylı mülkiyet',['paylı mülkiyet']),('İmar ruhsatı',['imar ruhsatı']),('Cezai şart',['cezai şart']),('İpotek',['ipotek']),('Üçüncü kişi',['üçüncü kişi','3. kişi'])]
              for lab,keys in pairs:
                  if any(k in s for k in keys): out.append(lab)
                  if len(out)==4: break
              return out or ['İnşaat sözleşmesi']

          p=R/'_data/ictihatlar.json'; d=json.loads(p.read_text()); cats={c['id']:c for c in d['categories']}; listed={x['url'] for c in d['categories'] for x in c['items']}; added=[]
          for f in sorted((R/'ictihat').glob('*.njk')):
              if f.name=='index.njk': continue
              t=f.read_text(); u=fm(t,'permalink')
              if not u or u in listed or 'noindex' in fm(t,'robots').lower(): continue
              tf=fm(t,'title'); title=tf.split('|',1)[1].strip() if '|' in tf else tf
              cm=re.search(r'<aside class="precedent-kunye">[\s\S]*?<h1>(.*?)</h1>',t); court=clean(cm.group(1)) if cm else 'Yargıtay Hukuk Genel Kurulu'
              sm=re.search(r'<aside class="precedent-summary">[\s\S]*?<p>(.*?)</p>',t); summary=clean(sm.group(1)) if sm else fm(t,'description')
              e,k=fld(t,'Esas No'),fld(t,'Karar No'); dt=fld(t,'Karar Tarihi') or fld(t,'Sonuç Tarihi')
              if e and k: meta=f'{court} · E. {e} · K. {k}'+(f' · {dt}' if dt else '')
              else:
                  bn=fld(t,'Başvuru No'); meta=court+(f' · B. No: {bn}' if bn else '')+(f' · {dt}' if dt else '')
              em=re.search(r'<div class="eyebrow">İçtihat\s*·\s*(.*?)</div>',t); topic=clean(em.group(1)) if em else ''; low=(topic+' '+title+' '+summary).lower()
              cid='insaat-hukuku' if ('eser sözleşmesi' in low or 'inşaat sözleşmesi' in low) else ('kira-hukuku' if 'kira' in low else ('imar-mulkiyet-hukuku' if 'imar' in low else 'gayrimenkul-tasinmaz-hukuku'))
              cats[cid]['items'].append({'court':court,'meta':meta,'title':title,'summary':summary,'tags':tags(title,summary),'url':u}); listed.add(u); added.append(u)
          if len(added)!=21: raise SystemExit(f'Expected 21 new public precedent cards, found {len(added)}')
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':')))

          files=list((R/'content/makaleler').glob('*.md'))+list((R/'_data').glob('*.json'))+list(R.glob('*.njk'))+list(R.glob('*.html'))+list((R/'_includes').rglob('*.njk'))
          for dn in ['kentsel-donusum-hukuku','imar-hukuku','insaat-hukuku','gayrimenkul-hukuku','kira-hukuku']: files+=list((R/dn).glob('*.njk'))
          for f in dict.fromkeys(files):
              t=f.read_text(); o=t
              t=re.sub(r'\b[Rr]ezerv [Aa]lan\b',lambda m:'Rezerv Yapı Alanı' if m.group(0)[0].isupper() else 'rezerv yapı alanı',t)
              t=t.replace('Riskli alanın iki ana maddi yolu','Riskli alan kararının başlıca maddi dayanakları')
              t=t.replace('Riskli alan Cumhurbaşkanı kararıyla kurulur.','Riskli alan statüsü Cumhurbaşkanı kararıyla belirlenir.')
              t=t.replace('Riskli yapı bir bina tespitidir; riskli alan teknik ve/veya ek m.1 ölçütleriyle kurulan Cumhurbaşkanı kararıdır; rezerv yapı alanı ise 6306 uygulama amacıyla Bakanlıkça belirlenen daha geniş işlevli alandır.','Riskli yapı bir bina tespitidir; riskli alan, Kanun ve ek m.1’deki ölçütler çerçevesinde Cumhurbaşkanınca kararlaştırılan bir alan statüsüdür; rezerv yapı alanı ise 6306 uygulama amacıyla Bakanlıkça belirlenen daha geniş işlevli alandır.')
              if t!=o: f.write_text(t)

          hp=R/'_data/hukukiGelismeler.json'; us=json.loads(hp.read_text())
          def cl(old,title):
              q=title.lower()
              cat='Kentsel Dönüşüm Hukuku' if old in ('Kentsel Dönüşüm','Kentsel Dönüşüm Hukuku') else ('İmar Hukuku' if old in ('İmar Hukuku','Mülkiyet / İmar Hukuku','Arazi / İmar Hukuku') else ('İnşaat Hukuku' if old=='İnşaat Hukuku' else ('Kira Hukuku' if old=='Kira Hukuku' else 'Gayrimenkul Hukuku')))
              if 'kat mülkiyeti' in q: tag='Kat Mülkiyeti'
              elif 'ortaklığın giderilmesi' in q: tag='Ortaklığın Giderilmesi'
              elif 'kamulaştırmasız el atma' in q: tag='Kamulaştırmasız El Atma'
              elif 'kamulaştırma' in q: tag='Kamulaştırma'
              elif 'planlı alanlar' in q: tag='İmar Yönetmeliği'
              elif 'imar plan' in q or 'plan değişik' in q: tag='İmar Planları'
              elif 'yenileme alan' in q: tag='Yenileme Alanı'
              elif 'dask' in q: tag='DASK'
              elif 'kira' in q: tag='Kira Bedeli'
              elif 'yarısı bizden' in q: tag='Yarısı Bizden'
              elif 'arazi' in q or 'toprak' in q: tag='Arazi ve Toprak Koruma'
              else: tag='Güncel Gelişme'
              return cat,tag
          allowed={'Gayrimenkul Hukuku','İmar Hukuku','İnşaat Hukuku','Kentsel Dönüşüm Hukuku','Kira Hukuku'}
          for u in us: u['category'],u['tag']=cl(u.get('category',''),u.get('title',''))
          if {u['category'] for u in us}-allowed: raise SystemExit('taxonomy failed')
          hp.write_text(json.dumps(us,ensure_ascii=False,indent=2)+'\n')
          for f in [R/'hukuki-gelismeler/index.njk',R/'index.html']:
              t=f.read_text().replace('{{ update.category }}</div>','{{ update.category }}{% if update.tag %} · {{ update.tag }}{% endif %}</div>').replace('{{ update.category }}</span>','{{ update.category }}{% if update.tag %} · {{ update.tag }}{% endif %}</span>'); f.write_text(t)

          ap=R/'content/makaleler/kentsel-donusum-arsa-payi-duzeltme-davasi.md'; t=ap.read_text(); old='**arsa payı tapuda kayıtlı ayni hak oranıdır.**'; new='**arsa payı, bağımsız bölüme tahsis edilen ve arsa üzerindeki ortak mülkiyet payını gösteren tapu sicili unsurudur.**'
          if old not in t: raise SystemExit('arsa payı phrase missing')
          ap.write_text(t.replace(old,new))
          home=R/'index.html'; t=home.read_text(); old='<h1 id="hero-title">Karmaşık hukuki sorunlara açık ve uygulanabilir çözümler</h1>'; new='<h1 id="hero-title">İmar, Kentsel Dönüşüm, İnşaat ve Gayrimenkul Hukukunda Danışmanlık</h1>'
          if old not in t: raise SystemExit('home h1 missing')
          home.write_text(t.replace(old,new))
          (R/'.github/workflows/terminology-round2.yml').unlink()
          PY
      - run: npm install
      - name: Build and audit
        run: npm run build
      - name: Verify invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          d=json.loads(Path('_data/ictihatlar.json').read_text()); urls=[x['url'] for c in d['categories'] for x in c['items']]
          if len(urls)!=len(set(urls)): raise SystemExit('duplicate precedent URL')
          pub=[]
          for f in Path('ictihat').glob('*.njk'):
              if f.name=='index.njk': continue
              t=f.read_text(); m=re.search(r'(?m)^permalink:\s*["\']?(.+?)["\']?\s*$',t); r=re.search(r'(?m)^robots:\s*["\']?(.+?)["\']?\s*$',t)
              if m and not(r and 'noindex' in r.group(1).lower()): pub.append(m.group(1).strip().strip('"\''))
          if set(pub)-set(urls): raise SystemExit('public precedent missing archive card')
          rendered=Path('_site/ictihat/index.html').read_text()
          if any(f'href="{u}"' not in rendered for u in pub): raise SystemExit('archive card not clickable')
          bad=[]
          for f in list(Path('content/makaleler').glob('*.md'))+list(Path('_data').glob('*.json')):
              for line in f.read_text().splitlines():
                  if line.startswith(('slug:','canonical:','permalink:','  - url:','    url:')): continue
                  if re.search(r'\brezerv alan\b',line,re.I): bad.append(f'{f}: {line.strip()}')
          if bad: raise SystemExit(f'unstandardised rezerv alan remains: {bad}')
          us=json.loads(Path('_data/hukukiGelismeler.json').read_text()); allowed={'Gayrimenkul Hukuku','İmar Hukuku','İnşaat Hukuku','Kentsel Dönüşüm Hukuku','Kira Hukuku'}
          if any(u.get('category') not in allowed or not u.get('tag') for u in us): raise SystemExit('taxonomy invariant failed')
          a=Path('content/makaleler/kentsel-donusum-arsa-payi-duzeltme-davasi.md').read_text()
          if 'arsa payı tapuda kayıtlı ayni hak oranıdır' in a or 'bağımsız bölüme tahsis edilen ve arsa üzerindeki ortak mülkiyet payını gösteren tapu sicili unsurudur' not in a: raise SystemExit('arsa payı invariant failed')
          if 'İmar, Kentsel Dönüşüm, İnşaat ve Gayrimenkul Hukukunda Danışmanlık' not in Path('_site/index.html').read_text(): raise SystemExit('H1 invariant failed')
          print(f'Archive verification: {len(pub)} public/indexable precedents, all listed and clickable.')
          print('Terminology/taxonomy invariants passed.')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name ozanferhatsen
          git config user.email ozanferhatsen@gmail.com
          git add -A
          git commit -m "Complete second-pass legal terminology and taxonomy audit"
          git push origin cms-deneme
