name: Build and Deploy Hukuk Departmani

on:
  push:
    branches:
      - cms-deneme
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Rebuild homepage hero image
        run: |
          cat hero-final-src/part*.b64 | tr -d '\n' | base64 --decode > assets/hero-office.webp
          test -s assets/hero-office.webp
          test "$(wc -c < assets/hero-office.webp)" -eq 81822
          echo "adcac71e551fbab7d09732db02dc516951234bb0486b52827620b988a9cf487b  assets/hero-office.webp" | sha256sum -c -
      - name: Build site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
