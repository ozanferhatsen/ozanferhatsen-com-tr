name: Build and Deploy Hukuk Departmani

on:
  push:
    branches:
      - cms-deneme
  pull_request:
    branches:
      - cms-deneme
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Dependency security audit
        run: npm audit --audit-level=high
      - name: Verify homepage hero source
        run: |
          test -s assets/hero-office-family.png
          file assets/hero-office-family.png
      - name: Report article reading times
        run: |
          npx eleventy
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const root = '_site/makaleler';
          const rows = [];
          for (const slug of fs.readdirSync(root)) {
            const file = path.join(root, slug, 'index.html');
            if (!fs.existsSync(file)) continue;
            const html = fs.readFileSync(file, 'utf8');
            const title = html.match(/<h1>([\s\S]*?)<\/h1>/i)?.[1]?.replace(/<[^>]+>/g, '').trim();
            const words = html.match(/class="article-meta" data-word-count="(\d+)"/)?.[1];
            const minutes = html.match(/class="article-meta"[^>]*>(\d+) dk okuma/)?.[1];
            if (title && words && minutes) rows.push({ title, words: Number(words), minutes: Number(minutes) });
          }
          rows.sort((a, b) => b.words - a.words);
          console.log(`READING_TIME_REPORT_COUNT=${rows.length}`);
          for (const row of rows) console.log(`${row.words}\t${row.minutes} dk\t${row.title}`);
          NODE
      - name: Build site and run SEO audit
        run: npm run build
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
